<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Airbnb Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search search--big"
      data-qa="big"
    >
      <label class="search__label">
        <input
          class="search__input search__input--big"
          type="text"
          placeholder="Try &#34;Los Angeles&#34;"
          data-qa="keypress"
        />
      </label>
    </form>
    <form
      class="search search--small"
      data-qa="small"
    >
      <label class="search__label">
        <input
          class="search__input search__input--small"
          type="text"
          placeholder="Try &#34;Los Angeles&#34;"
        />
      </label>
    </form>
  </body>
</html>
