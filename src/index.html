<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="body">
    <div class="input input--0">
      <img src="images/Search.svg" alt="search-logo" class="input__icon">
      <input
        type="text"
        data-qa="keypress"
        data-qa="big"
        placeholder="Try “Los Angeles“"
        class="input__field"
      />
    </div>
    <div class="input input--1">
      <img src="images/Search.svg" alt="search-logo" class="input__icon">
      <input
        type="text"
        data-qa="hover"
        data-qa="small"
        placeholder="Try “Los Angeles“"
        class="input__field"
      />
    </div>
  </body>
</html>
