<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Airbnb search bars</title>
    <link
      rel="stylesheet"
      href="reset.css"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="preload"
      href="./fonts/Avenir-Book.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="./fonts/Avenir-Heavy.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <form
      class="search-form search-form--large"
      action="#"
      method="get"
      data-qa="big"
    >
      <!-- prettier-ignore -->
      <input
        id="large-search"
        class="search-form__input search-form__input--large"
        type="text"
        name="large-search"
        placeholder="Try &quot;Los Angeles&quot;"
        aria-label="Search for a place"
        data-qa="keypress"
      />
    </form>

    <form
      class="search-form search-form--small"
      action="#"
      method="get"
      data-qa="small"
    >
      <!-- prettier-ignore -->
      <input
        id="small-search"
        class="search-form__input search-form__input--small"
        type="text"
        name="small-search"
        placeholder="Try &quot;Los Angeles&quot;"
        aria-label="Search for a place"
      />
    </form>
  </body>
</html>
