<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="
        width=device-width,
        user-scalable=no,
        initial-scale=1.0,
        maximum-scale=1.0,
        minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body class="page__body">
    <form
      class="search-bar search-bar--big page__form"
      action="#"
      method="get"
      data-qa="big"
    >
      <label class="search-bar__icon search-bar__icon--big">
        <input
          class="search-bar__input search-bar__input--big"
          type="text"
          name="query"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </label>
    </form>

    <form
      class="search-bar search-bar--small page__form"
      action="#"
      method="get"
      data-qa="small"
    >
      <label class="search-bar__icon search-bar__icon--small">
        <input
          class="search-bar__input search-bar__input--small"
          type="text"
          name="query"
          placeholder="Try “Los Angeles“"
        />
      </label>
    </form>
  </body>
</html>
