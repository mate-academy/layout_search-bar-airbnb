<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="reset.css"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div
      class="bigSearch"
      data-qa="big"
    >
      <img
        src="./images/Search.svg"
        alt="Search_logo"
        class="search-img1"
      />
      <input
        type="text"
        data-qa="keypress"
        placeholder=" "
        class="search-input1"
      />
      <span class="custom-placeholder1"></span>
    </div>
    <div
      class="smallSearch"
      data-qa="small"
    >
      <img
        src="./images/Search.svg"
        alt="Search_logo"
        class="search-img2"
      />
      <input
        type="text"
        data-qa="hover"
        placeholder=" "
        class="search-input2"
      />
      <span class="custom-placeholder2"></span>
    </div>
  </body>
</html>
