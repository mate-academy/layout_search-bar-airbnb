<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Bar Airbnb</title>

    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/forms.css" />
  </head>

  <body>
    <div class="forms">
      <!-- BIG SEARCH -->
      <h2 class="title">Default</h2>
      <input
        type="text"
        class="search search--big is-default"
        placeholder="Try “Los Angeles”"
        data-qa="keypress big"
      />

      <h2 class="title">Hover</h2>
      <input
        type="text"
        class="search search--big is-hover"
        placeholder="Try “Los Angeles”"
        data-qa="big"
      />

      <h2 class="title">Focus</h2>
      <input
        type="text"
        class="search search--big is-focus"
        value="Los An"
        data-qa="big"
      />

      <div class="gap"></div>

      <!-- SMALL SEARCH -->
      <input
        type="text"
        class="search search--small is-default"
        value="Los Angeles"
        data-qa="small"
      />

      <input
        type="text"
        class="search search--small is-hover"
        value="Los Angeles"
        data-qa="small"
      />

      <input
        type="text"
        class="search search--small is-focus"
        value="Los Angl"
        data-qa="small"
      />
    </div>
  </body>
</html>
