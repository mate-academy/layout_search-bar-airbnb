<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Airbnb Search Bar</title>

    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body>
    <form
      class="search search--big"
      data-qa="big"
    >
      <input
        class="search__input search__input--big"
        type="text"
        placeholder="Try “Los Angeles“"
        data-qa="keypress"
      />
    </form>

    <form
      class="search search--small"
      data-qa="small"
    >
      <input
        class="search__input search__input--small"
        type="text"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
