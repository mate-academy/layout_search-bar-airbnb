<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      action="#"
      method="get"
      class="search-bg"
      data-qa="big"
    >
      <div class="search-bg__icon"></div>

      <input
        class="search-bg__input"
        type="text"
        data-qa="keypress"
        placeholder="Try &#x22;Los Angeles&#x22;"
      />
    </form>

    <form
      action="#"
      method="get"
      class="search-sm"
      data-qa="small"
    >
      <div class="search-sm__icon"></div>

      <input
        class="search-sm__input"
        type="text"
        data-qa="keypress"
        placeholder="Try &#x22;Los Angeles&#x22;"
      />
    </form>
  </body>
</html>
