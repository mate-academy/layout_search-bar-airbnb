<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="./styles/style.css"
    />
  </head>
  <body>
    <form
      action="#"
      method="get"
      data-qa="big"
    >
      <label class="form-field">
        <div class="form-field__img"></div>
        <input
          name="big-search"
          class="form-field__input"
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </label>
    </form>
    <form
      action="#"
      method="get"
      data-qa="small"
    >
      <label class="form-field form-field--small">
        <div class="form-field__img form-field__img--small"></div>
        <input
          name="small-search"
          class="form-field__input form-field__input--small"
          type="text"
          placeholder="Try “Los Angeles“"
        />
      </label>
    </form>
  </body>
</html>
