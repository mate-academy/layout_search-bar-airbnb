<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Bars</title>

    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/forms.css" />
  </head>

  <body>
    <form class="forms">
      <!-- BIG SEARCH -->
      <h2 class="title">Default</h2>
      <div class="form__input" data-qa="big">
        <img src="images/Search.svg" alt="search" />
        <input
          type="text"
          class="search search--big is-default"
          placeholder="Try “Los Angeles”"
          data-qa="keypress"
        />
      </div>

      <h2 class="title">Hover</h2>
      <div class="form__input" data-qa="big">
        <img src="images/Search.svg" alt="search" />
        <input
          type="text"
          class="search search--big is-hover"
          placeholder="Try “Los Angeles”"
        />
      </div>

      <h2 class="title">Focus</h2>
      <div class="form__input" data-qa="big">
        <img src="images/Search.svg" alt="search" />
        <input
          type="text"
          class="search search--big is-focus"
          value="Los An"
        />
      </div>

      <!-- SMALL SEARCH -->
      <div class="spacer"></div>

      <div class="form__input" data-qa="small">
        <img src="images/Search.svg" alt="search" />
        <input
          type="text"
          class="search search--small is-default"
          value="Los Angeles"
        />
      </div>

      <div class="form__input" data-qa="small">
        <img src="images/Search.svg" alt="search" />
        <input
          type="text"
          class="search search--small is-hover"
          value="Los Angeles"
        />
      </div>

      <div class="form__input" data-qa="small">
        <img src="images/Search.svg" alt="search" />
        <input
          type="text"
          class="search search--small is-focus"
          value="Los Angl"
        />
      </div>
    </form>
  </body>
</html>
