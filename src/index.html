<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      data-qa="big"
      class="search__big"
    >
      <label
        for="search-big"
        class="search-big"
      ></label>
      <input
        class="search__big-input"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
        id="search-big"
      />
    </form>

    <form
      data-qa="small"
      class="search__small"
    >
      <label for="search-small"></label>
      <input
        type="text"
        placeholder="Try “Los Angeles“"
        id="search-small"
        class="search__small-input"
      />
    </form>
  </body>
</html>
