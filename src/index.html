<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Search bar</title>

    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search-bar"
      data-qa="big"
    >
      <input
        class="search-bar__input"
        type="text"
        placeholder="Try &#x22;Los Angeles&#x22;"
        data-qa="keypress"
      />
    </form>

    <form
      class="search-bar search-bar--small"
      data-qa="small"
    >
      <input
        class="search-bar__input search-bar__input--small"
        type="text"
        placeholder="Try &#34;Los Angeles&#34;"
      />
    </form>
  </body>
</html>
