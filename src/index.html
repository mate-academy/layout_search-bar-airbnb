<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <!-- #endregi -->
  <body>
    <form
      data-qa="big"
      class="big_form_city"
    >
      <div class="icon_big">
        <img
          src="/src/images/Search.svg"
          alt="search.img"
        />
      </div>

      <input
        class="big_input_city"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </form>

    <form
      data-qa="small"
      class="small_form_city"
    >
      <div class="icon_small">
        <img
          src="/src/images/Search.svg"
          alt="search.img"
        />
      </div>

      <input
        class="small_input_city"
        type="text"
        data-qa="hover"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
