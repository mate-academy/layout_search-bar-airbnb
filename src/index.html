<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Search-bar-airbnb</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="page__body">
    <form
      action="#"
      class="search search--large"
      data-qa="big"
    >
      <div class="search__wrap">
        <label
          for="search-field-large"
          class="search__label"
        ></label>
        <input
          name="search-l"
          id="search-field-large"
          class="search__input"
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>
    <form
      action="#"
      class="search search--small"
      data-qa="small"
    >
      <div class="search__wrap">
        <label
          for="search-field-s"
          class="search__label"
        ></label>
        <input
          name="search-s"
          id="search-field-s"
          class="search__input"
          type="text"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>
  </body>
</html>
