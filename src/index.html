<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="styles/style.css"
    />
  </head>
  <body class="page__body">
    <form
      action="#"
      method="post"
      data-qa="big"
      class="search search--big"
    >
      <label
        class="search__label"
        for="search-input-big"
      >
        <span class="search__icon search__icon--big"></span>
      </label>

      <input
        class="search__input"
        id="search-input-big"
        type="text"
        placeholder="Try “Los Angeles“"
        data-qa="keypress"
      />
    </form>

    <form
      action="#"
      method="post"
      data-qa="small"
      class="search search--small"
    >
      <label
        class="search__label"
        for="search-input-small"
      >
        <span class="search__icon search__icon--small"></span>
      </label>

      <input
        class="search__input"
        id="search-input-small"
        type="text"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
