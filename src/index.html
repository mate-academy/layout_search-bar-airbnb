<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <main>
      <form
        action="#"
        method="get"
        data-qa="big"
        class="search-form search-form--big"
      >
        <label class="search-form__icon" for="search-big"></label>
        <input
          class="search-form__input"
          id="search-big"
          type="text"
          data-qa="keypress"
          placeholder="Try &quot;Los Angeles&quot;"
        />
      </form>

      <form
        action="#"
        method="get"
        data-qa="small"
        class="search-form search-form--small"
      >
        <label class="search-form__icon" for="search-small"></label>
        <input
          class="search-form__input"
          id="search-small"
          type="text"
          placeholder="Try &quot;Los Angeles&quot;"
        />
      </form>
    </main>
  </body>
</html>
