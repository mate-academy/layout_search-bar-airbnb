<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="search-bar">
      <form
        action="#"
        method="get"
        id="search-big"
        name="search"
        class="search-bar__item search-bar__item--large"
        data-qa="big"
      >
        <div class="search-bar__icon search-bar__icon--large"></div>
        <input
          type="text"
          name="query"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
          class="search-bar__field search-bar__field--large"
        />
      </form>

      <form
        action="#"
        method="get"
        id="search-small"
        name="search"
        class="search-bar__item search-bar__item--small"
        data-qa="small"
      >
        <div class="search-bar__icon search-bar__icon--small"></div>
        <input
          type="text"
          name="query"
          placeholder="Try “Los Angeles“"
          class="search-bar__field search-bar__field--small"
        />
      </form>
    </div>
  </body>
</html>
