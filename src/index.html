<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="search">
      <form
        class="search-form"
        data-qa="big"
      >
        <input
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles”"
          class="search-form__field search-form__field--big"
        />
      </form>

      <form
        class="search-form"
        data-qa="small"
      >
        <input
          type="text"
          placeholder="Try “Los Angeles”"
          class="search-form__field search-form__field--small"
        />
      </form>
    </div>
  </body>
</html>
