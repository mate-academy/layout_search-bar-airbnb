<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Airbnb Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search-bar search-bar--big"
      data-qa="big"
      action="#"
    >
      <div class="search-bar__wrapper">
        <input
          type="text"
          name="q"
          class="search-bar__input"
          placeholder="Try “Los Angeles”"
          data-qa="keypress"
        />
        <button
          type="submit"
          class="search-bar__button"
          aria-label="Search"
        ></button>
      </div>
    </form>

    <form
      class="search-bar search-bar--small"
      data-qa="small"
      action="#"
    >
      <div class="search-bar__wrapper">
        <input
          type="text"
          name="q"
          class="search-bar__input"
          placeholder="Try “Los Angeles”"
        />
        <button
          type="submit"
          class="search-bar__button"
          aria-label="Search"
        ></button>
      </div>
    </form>
  </body>
</html>
