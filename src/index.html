<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="mainContainer">
    <div
      class="mainContainer__inputContainer"
      data-qa="big"
    >
      <input
        class="mainContainer__inputContainer-bigInput"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </div>

    <div
      class="mainContainer__smallInputContainer"
      data-qa="small"
    >
      <input
        class="mainContainer__smallInputContainer-smallInput"
        type="text"
        data-qa="hover"
        placeholder="Try “Los Angeles“"
      />
    </div>
  </body>
</html>
