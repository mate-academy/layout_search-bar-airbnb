<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="body">
    <main class="main">
      <form
        action="#"
        method="get"
        class="main__form"
        data-qa="big"
      >
        <div class="input-wrapper">
          <div class="input-wrapper__icon"></div>
          <input
            type="text"
            data-qa="keypress"
            placeholder="Try &ldquo;Los Angeles&rdquo;"
            class="input-wrapper__input"
          />
        </div>
      </form>

      <form
        action="#"
        method="get"
        class="main__form"
        data-qa="small"
      >
        <div class="input-wrapper input-wrapper__small">
          <div class="input-wrapper__icon input-wrapper__icon--small"></div>
          <input
            type="text"
            data-qa="hover"
            placeholder="Try &ldquo;Los Angeles&rdquo;"
            class="input-wrapper__input input-wrapper__input--small"
          />
        </div>
      </form>
    </main>
  </body>
</html>
