<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
      user-scalable=no,
      initial-scale=1.0,
      maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Search</title>
    <link
      rel="stylesheet"
      href="./styles/style.css"
    />
  </head>
  <body>
    <main>
      <div class="search-bar">
        <form
          action="/"
          class="search-bar__form search-bar__form--big"
          method="get"
          data-qa="big"
        >
          <label
            for="bigSearch"
            class="search-bar__label search-bar__label--big"
          >
            <span class="search-bar__icon search-bar__icon--big"></span>
          </label>
          <input
            class="search-bar__input search-bar__input--big"
            name="big-search"
            id="bigSearch"
            type="text"
            data-qa="keypress"
            placeholder="Try “Los Angeles“"
          />
        </form>
      </div>

      <div class="search-bar">
        <form
          action="/"
          class="search-bar__form search-bar__form--small"
          method="get"
          data-qa="small"
        >
          <label
            for="smallSearch"
            class="search-bar__label search-bar__label--small"
          >
            <span class="search-bar__icon search-bar__icon--small"></span>
          </label>
          <input
            class="search-bar__input search-bar__input--small"
            name="small-search"
            id="smallSearch"
            type="text"
            placeholder="Try “Los Angeles“"
          />
        </form>
      </div>
    </main>
  </body>
</html>
