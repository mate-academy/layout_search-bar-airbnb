<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Barra de Pesquisa - Airbnb Style</title>
    <link
      href="./styles/style.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="search-container">
      <form
        class="search-container__form search-form search-form--big"
        data-qa="big"
        action="/search"
        method="GET"
      >
        <button
          class="search-form__button search-form__button--big"
          type="submit"
          aria-label="Pesquisar"
        ></button>
        <div class="search-form__field">
          <input
            class="search-form__input"
            type="text"
            id="search-big"
            name="query"
            placeholder="Try “Los Angeles”"
            data-qa="keypress"
            required
          />
        </div>
      </form>

      <form
        class="search-container__form search-form search-form--small"
        data-qa="small"
        action="/search"
        method="GET"
      >
        <button
          class="search-form__button search-form__button--small"
          type="submit"
          aria-label="Pesquisar"
        ></button>
        <div class="search-form__field">
          <input
            class="search-form__input"
            type="text"
            id="search-small"
            name="query"
            placeholder="Try “Los Angeles”"
            required
          />
        </div>
      </form>
    </div>
  </body>
</html>
