<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Airbnb Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search-form search-form--big"
      action="#"
      data-qa="big"
    >
      <!-- prettier-ignore -->
      <input
        class="search-form__input search-form__input--big"
        type="search"
        placeholder="Try &quot;Los Angeles&quot;"
        data-qa="keypress"
      />
    </form>

    <form
      class="search-form search-form--small"
      action="#"
      data-qa="small"
    >
      <!-- prettier-ignore -->
      <input
        class="search-form__input search-form__input--small"
        type="search"
        placeholder="Try &quot;Los Angeles&quot;"
      />
    </form>
  </body>
</html>
