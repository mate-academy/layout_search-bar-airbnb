<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div
      data-qa="big"
      class="field"
    >
      <img
        src="./images/Search.svg"
        alt="search"
        class="ikon-big"
      />

      <input
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
        class="big input"
      />
    </div>

    <div
      data-qa="small"
      class="field"
    >
      <img
        src="./images/Search.svg"
        alt="search"
        class="ikon-small"
      />

      <input
        type="text"
        placeholder="Try “Los Angeles“"
        class="small input"
      />
    </div>
  </body>
</html>
