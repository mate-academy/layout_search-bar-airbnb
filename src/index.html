<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <main class="page">
      <form
        class="search search--big"
        data-qa="big"
      >
        <button
          class="search__button"
          type="submit"
          aria-label="Search"
        ></button>

        <input
          class="search__input"
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </form>

      <form
        class="search search--small"
        data-qa="small"
      >
        <button
          class="search__button"
          type="submit"
          aria-label="Search"
        ></button>
        <input
          class="search__input"
          type="text"
          placeholder="Try “Los Angeles“"
        />
      </form>
    </main>
  </body>
</html>
