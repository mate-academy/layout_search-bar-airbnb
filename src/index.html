<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Airbnb search bars</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="preload"
      href="./fonts/Avenir-Book.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="./fonts/Avenir-Heavy.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header class="search-header">
      <form
        action="#"
        class="form-search form-search--big"
        data-qa="big"
      >
        <div class="form-search__icon form-search__icon--big"></div>
        <input
          type="text"
          class="form-search__input form-search__input--big"
          data-qa="keypress"
          placeholder="Try &#34;Los Angeles&#34;"
        />
      </form>

      <form
        action="#"
        class="form-search form-search--small"
        data-qa="small"
      >
        <div class="form-search__icon form-search__icon--small"></div>
        <input
          type="text"
          class="form-search__input form-search__input--small"
          placeholder="Try &#34;Los Angeles&#34;"
        />
      </form>
    </header>
  </body>
</html>
