<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search_big"
      data-qa="big"
    >
      <div class="search_big-container">
        <div class="search_big-img"></div>
        <input
          class="search_big-camp"
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>

    <form
      class="search_small"
      data-qa="small"
    >
      <div class="search_small-container">
        <div class="search_small-img"></div>
        <input
          class="search_small-camp"
          type="text"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>
  </body>
</html>
