<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="body">
    <main class="main">
      <form
        action="#"
        method="get"
      >
        <div
          class="input-wrapper main__element"
          data-qa="big"
        >
          <img
            src="./images/Search.svg"
            alt="search-icon"
            class="input-wrapper__icon"
          />
          <input
            type="text"
            data-qa="keypress"
            placeholder='Try "Los Angeles"'
            class="input-wrapper__input input-wrapper__input--big"
          />
        </div>
        <div
          class="input-wrapper main__element input-wrapper__small"
          data-qa="small"
        >
          <img
            src="./images/Search.svg"
            alt="search-icon"
            class="input-wrapper__icon input-wrapper__icon--small"
          />
          <input
            type="text"
            data-qa="hover"
            placeholder="Try “Los Angeles“"
            class="input-wrapper__input input-wrapper__input--small"
          />
        </div>
      </form>
    </main>
  </body>
</html>
