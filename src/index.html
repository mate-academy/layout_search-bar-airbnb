<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie-edge"
    />
    <title>Airbnb Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <main class="container">
      <form
        class="search-bar search-bar--big"
        action="#"
        data-qa="big"
      >
        <input
          type="text"
          class="search-bar__input"
          placeholder="Try “Los Angeles“"
          data-qa="keypress"
        />
      </form>

      <form
        class="search-bar search-bar--small"
        action="#"
        data-qa="small"
      >
        <input
          type="text"
          class="search-bar__input"
          placeholder="Try “Los Angeles“"
          data-qa="keypress"
        />
      </form>
    </main>
  </body>
</html>
