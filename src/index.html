<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="./styles/style.css"
    />
  </head>
  <body>
    <form
      class="search-form"
      data-qa="big"
      action="/submit"
      method="POST"
    >
      <div class="search-form__bar search-form__bar--s">
        <div class="icon icon--s"></div>

        <input
          type="text"
          name="big-search"
          class="search-form__input search-form__input--s"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>

    <form
      class="search-form"
      data-qa="small"
      action="/submit"
      method="POST"
    >
      <div class="search-form__bar search-form__bar--xs">
        <div class="icon icon--xs"></div>

        <input
          type="text"
          name="small-search"
          class="search-form__input search-form__input--xs"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>
  </body>
</html>
