<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="page__body">
    <div class="search">
      <form
        data-qa="big"
        class="search__form search__form--big"
      >
        <label class="search__bar search__bar--big">
          <input
            class="search__input search__input--big"
            type="text"
            data-qa="keypress"
            placeholder="Try “Los Angeles“"
          />
        </label>
      </form>
      <form
        data-qa="small"
        class="search__form search__form--small"
      >
        <label class="search__bar search__bar--small">
          <input
            class="search__input search__input--small"
            type="text"
            placeholder="Try “Los Angeles“"
          />
        </label>
      </form>
    </div>
  </body>
</html>
