<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="form form__big--indent"
      action="#"
      method="get"
      data-qa="big"
    >
      <input
        class="form__search search--big"
        type="search"
        data-qa="keypress"
        placeholder="Try &ldquo;Los Angeles&rdquo;"
      />
    </form>

    <form
      class="form form__small--indent"
      action="#"
      method="get"
      data-qa="small"
    >
      <input
        class="form__search search--small"
        type="search"
        data-qa="hover"
        placeholder="Try &ldquo;Los Angeles&rdquo;"
      />
    </form>
  </body>
</html>
