<!doctype html>
<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="page__body">
    <form
      class="search-form"
      data-qa="big"
    >
      <input
        type="text"
        class="search-form__input search-form__input--big search-form__icon--big"

      />

    <form
      class="search-form"
      data-qa="small"
    >
      <input
        type="text"
        class="search-form__input search-form__input--small search-form__icon--small"
        placeholder="Try &#34;Los Angeles&#34;"
      />
    </form>
  </body>
</html>
