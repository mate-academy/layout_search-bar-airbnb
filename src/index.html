<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-css-reset/dist/reset.min.css"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <form
      class="search-bar search-bar--big"
      data-qa="big"
    >
      <input
        type="text"
        placeholder="Try “Los Angeles”"
        class="search-bar__input"
        data-qa="keypress"
      />
    </form>
    <form
      class="search-bar search-bar--small"
      data-qa="small"
    >
      <input
        type="text"
        class="search-bar__input"
        placeholder="Try “Los Angeles”"
      />
    </form>
  </body>
</html>
