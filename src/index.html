<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <section class="search">
      <form
        class="search__form"
        data-qa="big"
      >
        <label class="search__item search__item--large">
          <input
            type="text"
            data-qa="keypress"
            placeholder="Try “Los Angeles“"
            class="search__input"
          />
        </label>
      </form>
      <form
        class="search__form"
        data-qa="small"
      >
        <label class="search__item">
          <input
            type="text"
            placeholder="Try “Los Angeles“"
            class="search__input"
          />
        </label>
      </form>
    </section>
  </body>
</html>
