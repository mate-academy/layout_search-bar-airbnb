<!-- #region head -->
<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <!-- #endregion head -->
  <body class="page__body">
    <div class="search-bars page__search-bars">
      <form
        data-qa="big"
        class="search-bar search-bars__search-bar search-bars__search-bar--big"
      >
        <input
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
          class="input search-bar__input search-bar__input--big"
        />
      </form>

      <form
        data-qa="small"
        class="search-bar search-bars__search-bar search-bars__search-bar--small"
      >
        <input
          type="text"
          data-qa="hover"
          placeholder="Try “Los Angeles“"
          class="input search-bar__input search-bar__input--small"
        />
      </form>
    </div>
  </body>
</html>
