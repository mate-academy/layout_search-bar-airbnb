<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      data-qa="big"
      class="search"
    >
      <div class="search_ikon search_ikon--large"></div>

      <input
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
        class="search_input search_input--large"
      />
    </form>

    <form
      data-qa="small"
      class="search"
    >
      <div class="search_ikon search_ikon--small"></div>

      <input
        type="text"
        placeholder="Try “Los Angeles“"
        class="search_input search_input--small"
      />
    </form>
  </body>
</html>
