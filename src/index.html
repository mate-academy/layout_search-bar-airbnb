<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="styles/style.css"
    />
  </head>
  <body>
    <form
      class="form form--1"
      action="#"
      method="get"
      data-qa="big"
    >
      <div class="form-search form-search--1">
        <button
          type="submit"
          class="icon icon--1"
        ></button>

        <input
          class="form-search__input form-search__input--1"
          type="text"
          name="city"
          data-qa="keypress"
          placeholder="Try &#34;Los Angeles&#34;"
        />
      </div>
    </form>

    <form
      class="form form--2"
      action="#"
      method="get"
      data-qa="small"
    >
      <div class="form-search form-search--2">
        <button
          type="submit"
          class="icon icon--2"
        ></button>

        <input
          class="form-search__input form-search__input--2"
          type="text"
          name="city"
          placeholder="Try &#34;Los Angeles&#34;"
        />
      </div>
    </form>
  </body>
</html>
