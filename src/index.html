<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="form form--big"
      data-qa="big"
    >
      <div class="form__search form__search--big">
        <span class="form__icon form__search-icon--big"></span>
        <input
          class="form__input form__input--big"
          type="search"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>

    <form
      class="form form--small"
      data-qa="small"
    >
      <div class="form__search form__search--small">
        <span class="form__icon form__search-icon--small"></span>
        <input
          class="form__input form__input--small"
          type="search"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>
  </body>
</html>
