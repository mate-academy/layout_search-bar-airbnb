<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>

    <form
      class="form big__form"
      data-qa="big"
    >
      <search
        class="search search--big"
      >
        <img
          class="search__img"
          src="./images/Search.svg"
          alt="search-icon"
        />

        <input
          class="input search__input"
          type="search"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </search>
    </form>

    <form
      class="form small__form"
      data-qa="small"
    >
      <search
        class="search search--small"
      >
        <img
          class="search__img"
          src="./images/Search.svg"
          alt="search-icon"
        />
        <input
          class="input search__input"
          type="search"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </search>
    </form>
  </body>
</html>
