<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="styles/style.css"
    />
  </head>
  <body>
    <form
      class="searchbar searchbar--big"
      action="#"
      method="GET"
      data-qa="big"
    >
      <div class="searchbar__logo logo--big"></div>
      <input
        class="searchbar__input input--big"
        type="text"
        name="query1"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </form>

    <form
      class="searchbar searchbar--small"
      action="#"
      method="get"
      data-qa="small"
    >
      <div class="searchbar__logo logo--small"></div>
      <input
        class="searchbar__input input--small"
        type="text"
        name="query2"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
