<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Search bars</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <div class="page">
      <form
        class="search-input search-input--big"
        data-qa="big"
      >
        <span class="search-input__icon search-input__icon--big"></span>
        <input
          type="text"
          name="search"
          class="search-input__field search-input__field--big"
          data-qa="keypress"
          placeholder="Try “Los Angeles”"
        />
      </form>

      <form
        class="search-input search-input--small"
        data-qa="small"
      >
        <span class="search-input__icon search-input__icon--small"></span>
        <input
          type="text"
          name="search"
          class="search-input__field search-input__field--small"
          placeholder="Try “Los Angeles”"
        />
      </form>
    </div>
  </body>
</html>
