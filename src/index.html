<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />

    <title>Search bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search search--big"
      data-qa="big"
    >
      <input
        class="search__input"
        type="text"
        placeholder="Try &#34;Los Angeles&#34;"
        data-qa="keypress"
      />
    </form>

    <form
      class="search search--small"
      data-qa="small"
    >
      <input
        class="search__input"
        type="text"
        placeholder="Try &#34;Los Angeles&#34;"
      />
    </form>
  </body>
</html>
