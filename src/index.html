<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search-form search-form--big"
      data-qa="big"
    >
      <button
        class="search-form__icon search-form__icon--big"
        type="submit"
        aria-label="search"
      ></button>
      <input
        class="search-form__input search-form__input--big"
        name="big_search_form"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </form>

    <form
      class="search-form search-form--small"
      data-qa="small"
    >
      <button
        class="search-form__icon search-form__icon--small"
        type="submit"
        aria-label="search"
      ></button>
      <input
        class="search-form__input search-form__input--small"
        name="small_search_form"
        type="text"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
