<!doctype html>
<html
  class="page"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Search Bar</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body class="page__body">
    <div class="page__content">
      <form
        class="form form--big"
        action="#"
        method="post"
        data-qa="big"
      >
        <label
          class="form__field form__field--big"
          for="big"
        >
          <span class="form__icon form__icon--big"></span>
          <input
            class="form__input form__input--big"
            id="big"
            type="text"
            data-qa="keypress"
            placeholder="Try “Los Angeles“"
          />
        </label>
      </form>
      <form
        class="form form--small"
        action="#"
        method="post"
        data-qa="small"
      >
        <label
          class="form__field form__field--small"
          for="small"
        >
          <span class="form__icon form__icon--small"></span>
          <input
            class="form__input form__input--small"
            id="small"
            type="text"
            placeholder="Try “Los Angeles“"
          />
        </label>
      </form>
    </div>
  </body>
</html>
