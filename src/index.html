<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Search bars</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <main>
      <form
        class="search search--big"
        data-qa="big"
      >
        <div
          class="search__icon search__icon--big"
          aria-hidden="true"
        ></div>
        <input
          class="search__input search__input--big"
          type="text"
          data-qa="keypress"
          placeholder="Try &#34;Los Angeles&#34;"
          aria-label="Big search"
        />
      </form>

      <form
        class="search search--small"
        data-qa="small"
      >
        <div
          class="search__icon search__icon--small"
          aria-hidden="true"
        ></div>
        <input
          class="search__input search__input--small"
          type="text"
          placeholder="Try &#34;Los Angeles&#34;"
          aria-label="Small search"
        />
      </form>
    </main>
  </body>
</html>
