<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="styles/style.css"
    />
  </head>
  <body>
    <form
      class="search search__top"
      action="#"
      data-qa="big"
      method="post"
    >
      <div class="search__wrapper">
        <label
          aria-label="Search icon"
          role="img"
          class="search__image search__image--top"
          for="bigSearch"
        ></label>
        <input
          class="search__input search__input--top"
          type="text"
          id="bigSearch"
          name="realDatesBig"
          data-qa="keypress"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>

    <form
      class="search search__bottom"
      action="#"
      data-qa="small"
      method="post"
    >
      <div class="search__wrapper">
        <label
          aria-label="Search icon"
          role="img"
          class="search__image search__image--bottom"
          for="smallSearch"
        ></label>
        <input
          class="search__input search__input--bottom"
          type="text"
          id="smallSearch"
          name="realDatesSmall"
          placeholder="Try “Los Angeles“"
        />
      </div>
    </form>
  </body>
</html>
