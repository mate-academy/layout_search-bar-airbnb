<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Search bar</title>

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <form
      class="search"
      data-qa="big"
    >
      <input
        class="search__input"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles”"
      />
    </form>

    <form
      class="search"
      data-qa="small"
    >
      <input
        class="search__input"
        type="text"
        placeholder="Try “Los Angeles”"
      />
    </form>
  </body>
</html>
