<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body class="page">
    <form
      class="search search--first"
      data-qa="big"
    >
      <div class="search__icon search__icon--big"></div>
      <input
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
        class="search__input search__input--big search__input--full-width"
      />
    </form>

    <form
      class="search"
      data-qa="small"
    >
      <div class="search__icon search__icon--small"></div>
      <input
        type="text"
        placeholder="Try “Los Angeles“"
        class="search__input search__input--small search__input--full-width"
      />
    </form>
  </body>
</html>
