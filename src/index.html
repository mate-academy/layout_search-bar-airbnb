<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body class="page__body">
    <!-- #region input1 -->
    <div
      data-qa="big"
      class="container container--first"
    >
      <input
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
        class="search-field"
      />
      <img
        src="images/Search.svg"
        alt="search-icon"
        class="search-icon"
      />
    </div>
    <!-- #endregion -->

    <!-- #region input2 -->
    <div
      data-qa="small"
      class="container container--second"
    >
      <input
        type="text"
        data-qa="hover"
        placeholder="Try “Los Angeles“"
        class="search-field search-field--small"
      />
      <img
        src="images/Search.svg"
        alt="search-icon"
        class="search-icon search-icon--small"
      />
    </div>
    <!-- #endregion -->
  </body>
</html>
