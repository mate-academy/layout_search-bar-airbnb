<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body class="page">
    <form
      class="search page__search search--pc"
      data-qa="big"
    >
      <div class="search__icon search__icon--pc"></div>

      <input
        class="search__field search__field--pc"
        type="text"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </form>

    <form
      class="search page__search search--mobile"
      data-qa="small"
    >
      <div class="search__icon search__icon--mobile"></div>

      <input
        class="search__field search__field--mobile"
        type="text"
        data-qa="hover"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
