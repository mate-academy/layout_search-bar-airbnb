<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,
               user-scalable=no,
               initial-scale=1.0,
               maximum-scale=1.0,
               minimum-scale=1.0"
    />

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="search-container">
      <form data-qa="big" class="form form--big">
        <input
          class="form__input form__input--big"
          name="city_search_big"
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles”"
        />
      </form>

      <form data-qa="small" class="form form--small">
        <input
          name="city_search_small"
          class="form__input form__input--small"
          type="text"
          placeholder="Try “Los Angeles”"
        />
      </form>
    </main>
  </body>
</html>
