<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      class="search-form search-form--big"
      data-qa="big"
    >
      <div class="search-form__container">
        <span class="search-form__icon"></span>
        <input
          type="text"
          class="search-form__input"
          data-qa="keypress"
          placeholder="Try “Los Angeles”"
        />
      </div>
    </form>

    <form
      class="search-form search-form--small"
      data-qa="small"
    >
      <div class="search-form__container">
        <span class="search-form__icon"></span>
        <input
          type="text"
          class="search-form__input"
          placeholder="Try “Los Angeles”"
        />
      </div>
    </form>
  </body>
</html>
