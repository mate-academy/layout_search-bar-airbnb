<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <form
      action="#"
      class="search-form search-form--big"
      data-qa="big"
    >
      <input
        type="text"
        name="search-input"
        placeholder="Try &#8220;Los Angeles&#8221;"
        data-qa="keypress"
        class="search__input search__input--big"
        aria-label="Search"
      />
    </form>

    <form
      action="#"
      class="search-form search-form--small"
      data-qa="small"
    >
      <input
        type="text"
        name="search-input"
        placeholder="Try &#8220;Los Angeles&#8221;"
        class="search__input search__input--small"
        aria-label="Search"
      />
    </form>
  </body>
</html>
